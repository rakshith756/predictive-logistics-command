name: Fix Project Structure

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create project structure
        run: |
          mkdir -p database models services templates static/css static/js data tests

          # Python packages
          touch database/__init__.py
          touch models/__init__.py
          touch services/__init__.py
          touch tests/__init__.py

          # Database
          [ -f seed.py ] && mv seed.py database/seed.py
          [ -f db.py ] && mv db.py services/db.py

          # Models
          for f in prediction_engine.py risk_engine.py recommendation_engine.py route_engine.py
          do
            [ -f "$f" ] && mv "$f" models/
          done

          # Services
          for f in alert_service.py inventory_service.py convoy_service.py simulation_service.py weather_service.py
          do
            [ -f "$f" ] && mv "$f" services/
          done

          # Templates
          for f in *.html
          do
            [ -f "$f" ] && mv "$f" templates/
          done

          # Data
          for f in *.csv
          do
            [ -f "$f" ] && mv "$f" data/
          done

          # Tests
          for f in test_*.py conftest.py
          do
            [ -f "$f" ] && mv "$f" tests/
          done

          # CSS
          [ -f style.css ] && mv style.css static/css/style.css

      - name: Create database schema
        run: |
          cat > database/schema.sql <<'EOF'
          PRAGMA foreign_keys = ON;

          CREATE TABLE IF NOT EXISTS units (
            id INTEGER PRIMARY KEY,
            name TEXT UNIQUE NOT NULL,
            location TEXT NOT NULL,
            lat REAL NOT NULL,
            lon REAL NOT NULL,
            personnel INTEGER NOT NULL,
            weather_id INTEGER
          );

          CREATE TABLE IF NOT EXISTS inventory (
            id INTEGER PRIMARY KEY,
            unit_id INTEGER NOT NULL,
            resource TEXT NOT NULL,
            category TEXT NOT NULL,
            unit TEXT NOT NULL,
            available REAL NOT NULL,
            required REAL NOT NULL,
            safety_stock REAL NOT NULL,
            daily_consumption REAL NOT NULL
          );

          CREATE TABLE IF NOT EXISTS consumption_history (
            id INTEGER PRIMARY KEY,
            unit_id INTEGER NOT NULL,
            resource TEXT NOT NULL,
            day TEXT NOT NULL,
            quantity REAL NOT NULL
          );

          CREATE TABLE IF NOT EXISTS depots (
            id INTEGER PRIMARY KEY,
            name TEXT UNIQUE NOT NULL,
            lat REAL NOT NULL,
            lon REAL NOT NULL,
            fuel REAL NOT NULL,
            food REAL NOT NULL,
            water REAL NOT NULL,
            medical REAL NOT NULL,
            spare_parts REAL NOT NULL
          );

          CREATE TABLE IF NOT EXISTS routes (
            id INTEGER PRIMARY KEY,
            route_id TEXT UNIQUE NOT NULL,
            origin_id INTEGER NOT NULL,
            destination_unit_id INTEGER NOT NULL,
            distance_km REAL NOT NULL,
            eta_hours REAL NOT NULL,
            risk_score REAL NOT NULL,
            weather_impact REAL NOT NULL,
            status TEXT NOT NULL
          );

          CREATE TABLE IF NOT EXISTS convoys (
            id INTEGER PRIMARY KEY,
            convoy_id TEXT UNIQUE NOT NULL,
            origin_id INTEGER NOT NULL,
            destination_unit_id INTEGER NOT NULL,
            cargo TEXT NOT NULL,
            quantity REAL NOT NULL,
            departure TEXT NOT NULL,
            eta TEXT NOT NULL,
            status TEXT NOT NULL,
            delay_hours REAL NOT NULL,
            risk_score REAL NOT NULL
          );

          CREATE TABLE IF NOT EXISTS weather (
            id INTEGER PRIMARY KEY,
            location TEXT NOT NULL,
            condition TEXT NOT NULL,
            temperature REAL NOT NULL,
            impact TEXT NOT NULL,
            impact_score REAL NOT NULL,
            observed_at TEXT NOT NULL
          );

          CREATE TABLE IF NOT EXISTS alerts (
            id INTEGER PRIMARY KEY,
            timestamp TEXT NOT NULL,
            severity TEXT NOT NULL,
            unit_id INTEGER,
            resource TEXT,
            reason TEXT NOT NULL,
            action TEXT NOT NULL,
            status TEXT NOT NULL
          );

          CREATE TABLE IF NOT EXISTS predictions (
            id INTEGER PRIMARY KEY,
            unit_id INTEGER NOT NULL,
            resource TEXT NOT NULL,
            predicted_daily REAL NOT NULL,
            days_to_safety REAL NOT NULL,
            shortage_hours REAL,
            risk_score REAL NOT NULL,
            confidence REAL NOT NULL,
            explanation TEXT NOT NULL,
            created_at TEXT NOT NULL
          );

          CREATE TABLE IF NOT EXISTS simulation_state (
            id INTEGER PRIMARY KEY CHECK(id=1),
            running INTEGER NOT NULL DEFAULT 0,
            tick INTEGER NOT NULL DEFAULT 0,
            mode TEXT NOT NULL DEFAULT 'IDLE',
            started_at TEXT,
            updated_at TEXT
          );
          EOF

      - name: Create frontend JavaScript
        run: |
          cat > static/js/app.js <<'EOF'
          const $=s=>document.querySelector(s);

          async function api(url,opt){
            const r=await fetch(url,opt);
            const d=await r.json();
            if(!r.ok) throw Error(d.error||'Request failed');
            return d;
          }

          const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({
            '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
          }[m]));

          function toast(x){
            const e=$('#toast');
            if(e){e.textContent=x;e.style.display='block';setTimeout(()=>e.style.display='none',2500)}
          }

          function riskClass(x){
            return ['CRITICAL','HIGH'].includes(x)?'critical':
                   x==='MEDIUM'?'warning':'safe';
          }

          setInterval(()=>{
            const e=$('#clock');
            if(e)e.textContent=new Date().toLocaleString();
          },1000);

          async function loadDashboard(){
            const d=await api('/api/dashboard');

            $('#kpis').innerHTML=[
              ['FORWARD UNITS',d.kpis.units],
              ['AVAILABILITY',d.kpis.availability+'%'],
              ['ACTIVE CONVOYS',d.kpis.active_convoys],
              ['LOW STOCK',d.kpis.low_stock],
              ['HIGH RISK',d.kpis.high_risk],
              ['CRITICAL ALERTS',d.kpis.critical_alerts]
            ].map(x=>`<div class="kpi"><small>${x[0]}</small><strong>${x[1]}</strong></div>`).join('');

            $('#healthScore').textContent=Math.round(d.health_score);
            $('#healthLabel').textContent=d.health_label;

            $('#resources').innerHTML=d.resources.map(r=>
              `<div class="bar"><label>${esc(r.resource)}</label>
              <div class="bar-track"><div class="bar-fill" style="width:${r.availability}%"></div></div>
              <b>${r.availability}%</b></div>`).join('');

            $('#riskFocus').innerHTML=
              `<div class="risk-card">
              <span class="pill ${riskClass(d.risk_focus.risk_level)}">${d.risk_focus.risk_level}</span>
              <h3>${d.risk_focus.resource} — ${
